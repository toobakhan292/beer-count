<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beer Count</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Beer Count">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#b9770e">
<style>
:root{--bg:#f6f3ec;--card:#fff;--ink:#1f1b16;--mute:#7a7164;--line:#e6dfd2;--acc:#b9770e;--acc2:#8a5707;--ok:#2e7d32}
@media(prefers-color-scheme:dark){:root{--bg:#161411;--card:#211e1a;--ink:#f3ede2;--mute:#a39a8b;--line:#363028;--acc:#e0a03a;--acc2:#f0b95c;--ok:#7cc77f}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:env(safe-area-inset-top) 0 calc(90px + env(safe-area-inset-bottom))}
header{padding:16px 16px 8px}
h1{margin:0 0 10px;font-size:22px}
.date{display:flex;gap:8px;align-items:center}
.date input{flex:1;font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.date .saved{font-size:13px;color:var(--ok);min-width:60px;text-align:right}
.beer-local{--bc:#b9770e;--bt:#fdf1d9;--bd:#7a4d05}
.beer-imported{--bc:#1f7a8c;--bt:#dff1f4;--bd:#0f4f5c}
.beer-special{--bc:#7b3fa0;--bt:#efe3f7;--bd:#4f2468}
@media(prefers-color-scheme:dark){.beer-local{--bc:#e0a03a;--bt:#3a2c12;--bd:#f0c36e}.beer-imported{--bc:#4fb4c8;--bt:#12333a;--bd:#8fd8e6}.beer-special{--bc:#b583d9;--bt:#2d1b3a;--bd:#dcb6f2}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:12px 16px;padding:14px}
.card h2{margin:0 0 4px;font-size:18px;color:var(--acc2)}
.bcard{padding:0 0 14px;border-top:6px solid var(--bc);scroll-margin-top:64px;overflow:hidden}
.bhead{background:var(--bt);padding:12px 14px}
.bhead h2{margin:0;font-size:22px;color:var(--bd)}
.bhead .sub{margin:2px 0 0;font-size:13px;color:var(--bd);opacity:.85}
.bbody{padding:0 14px}
.nav{position:sticky;top:0;z-index:5;display:flex;gap:8px;padding:8px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.chip{flex:1;border:0;border-radius:12px;padding:8px 6px;background:var(--bt);color:var(--bd);font-family:inherit;font-size:13px;display:flex;flex-direction:column;align-items:center;border-bottom:3px solid var(--bc)}
.chip b{font-size:18px;font-weight:700}
.loc{background:var(--bg);border-radius:12px;padding:10px 12px;margin-top:10px}
.locname{display:flex;justify-content:space-between;align-items:baseline;font-weight:600;font-size:18px;margin-bottom:4px}
.locname span{color:var(--bd);font-weight:700;font-size:15px}
.frow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0}
.fl{font-size:16px}
.fl small{display:block;color:var(--mute);font-size:13px}
.step{display:flex;align-items:center;gap:6px}
.step button{width:46px;height:46px;border-radius:12px;border:0;background:var(--bt);color:var(--bd);font-size:26px;line-height:1;padding:0;font-family:inherit}
.step button:active{background:var(--bc);color:#fff}
.step input{width:64px;height:46px;min-width:0;border:1px solid var(--line);border-radius:12px;text-align:center;font-weight:600;font-size:22px;font-family:inherit;background:var(--card);color:var(--ink);-moz-appearance:textfield}
.step input:focus{outline:2px solid var(--bc)}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.tot{margin-top:14px;padding-top:10px;border-top:2px solid var(--bc)}
.big{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0;font-size:16px}
.big b{font-size:22px}
.big b.final{font-size:30px;color:var(--bd)}
.spill{margin-top:14px;padding:10px 12px;border-radius:12px;border:1.5px dashed var(--bc)}
.spill .sph{font-weight:600;font-size:17px;color:var(--bd);margin-bottom:2px}
.spill .month{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;padding-top:8px;border-top:1px solid var(--line)}
.spill .month b{font-size:24px;color:var(--bd)}
.sum{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px}
.sum button{flex:1;font-weight:600;font-size:16px;font-family:inherit;padding:13px;border-radius:12px;border:0;background:var(--acc);color:#fff}
.sum button.sec{background:var(--bg);color:var(--ink);border:1px solid var(--line);flex:.6}
#report{margin:12px 16px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;white-space:pre-wrap;font:14px/1.5 ui-monospace,Menlo,monospace;display:none}
.note{font-size:12px;color:var(--mute);text-align:center;margin:8px 16px}
.recv{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.recv .k{color:var(--ink);font-weight:600;margin-bottom:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--bg);font-size:15px}
.cmp .d{font-size:13px;color:var(--mute);margin-top:2px}
.cmp.ok{border-left:4px solid var(--ok)}
.cmp.bad{border-left:4px solid #d32f2f}
.cmp.bad b{color:#d32f2f}
.gap{background:#fff3d6;color:#6b4a00;border-radius:10px;padding:8px 10px;font-size:13px;margin:6px 0 8px;display:none}
@media(prefers-color-scheme:dark){.gap{background:#3a2e12;color:#f0d9a0}}
.remind{display:none;background:#fff3d6;color:#6b4a00;margin:8px 16px 0;padding:10px 12px;border-radius:12px;font-size:14px}
@media(prefers-color-scheme:dark){.remind{background:#3a2e12;color:#f0d9a0}}
#bk button{font-weight:600;font-size:15px;font-family:inherit;padding:12px;border-radius:12px;border:0;background:var(--acc);color:#fff}
#bk button.alt{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
#bk button.full{width:100%;margin-top:8px}
.bkrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bkinfo{margin:0 0 10px;color:var(--mute);font-size:14px}
#bk textarea{width:100%;margin-top:8px;font:13px ui-monospace,Menlo,monospace;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
#bk input[type=file]{margin-top:10px;width:100%;font-size:14px}
.bkmsg{margin-top:8px;font-size:14px;color:var(--ok)}
.bkmsg.bad{color:#d32f2f}
.sub{font-size:12px;color:var(--mute);margin:-2px 0 6px}
.sumhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.sumhead h2{margin:0;font-size:20px;color:var(--ink)}
.sumhead span{color:var(--mute);font-size:14px}
.sumtab{width:100%;border-collapse:separate;border-spacing:0;font-size:15px}
.sumtab th{padding:8px 4px;font-size:13px;font-weight:700;background:var(--bt);color:var(--bd);border-bottom:3px solid var(--bc)}
.sumtab th:first-child{background:none;border-bottom:0}
.sumtab td{padding:8px 4px;text-align:center;border-top:1px solid var(--line)}
.sumtab td:first-child{text-align:left;color:var(--mute);font-size:14px;padding-left:0}
.sumtab tr.strong td{font-weight:700;font-size:17px}
.sumtab tr.strong td:first-child{color:var(--ink);font-size:14px}
.sumtab .okt{color:var(--ok);font-weight:700}
.sumtab .badt{color:#d32f2f;font-weight:700}
.sumtab .dash{color:var(--mute)}
.sumall{margin-top:10px;padding-top:10px;border-top:2px solid var(--line);display:flex;justify-content:space-between;font-size:15px}
</style>
</head>
<body>
<header>
  <h1>🍺 Morning Beer Count</h1>
  <div class="date"><input type="date" id="date"><span class="saved" id="saved"></span></div>
</header>
<div class="nav" id="nav"></div>
<div id="bk-remind" class="remind"></div>
<div class="card" id="summary"></div>
<div id="app"></div>
<div class="card" id="bk">
  <h2>Backup</h2>
  <p class="bkinfo" id="bk-info"></p>
  <div class="bkrow"><button id="bkSave">Back up</button><button id="bkCsv" class="alt">Export to spreadsheet</button></div>
  <button id="bkRestore" class="alt full">Restore from backup</button>
  <div id="bk-restore" style="display:none">
    <input type="file" id="bkFile" accept=".json,.txt,application/json,text/plain">
    <textarea id="bkPaste" rows="4" placeholder="Or paste backup text here"></textarea>
    <button id="bkDoRestore" class="full">Restore</button>
  </div>
  <div id="bk-out" style="display:none">
    <textarea id="bkText" rows="6" readonly></textarea>
    <button id="bkCopy" class="full">Copy text</button>
  </div>
  <div class="bkmsg" id="bk-msg"></div>
</div>
<div id="report"></div>
<p class="note">Counts save automatically on this device, one report per date.</p>
<div class="sum">
  <button id="btnReport">Show report</button>
  <button id="btnCopy">Copy</button>
  <button id="btnClear" class="sec">Clear</button>
</div>
<script>
const BEERS=[["local","Local Beer"],["imported","Imported Beer"],["special","Special Import Beer"]];
const F_BOX=[["b6","Boxes of 6",6],["b12","Boxes of 12",12],["b24","Boxes of 24",24],["loose","Loose bottles",1]];
const F_BAR=[["r8","Rows of 8",8],["r7","Rows of 7",7],["loose","Loose bottles",1]];
const F_COOL=[["r7","Rows of 7",7],["r6","Rows of 6",6],["loose","Loose bottles",1]];
const LOCS=[["storage","Storage",F_BOX],["bar","Bar",F_BAR],["cooler1","Cooler 1",F_COOL],["cooler2","Cooler 2",F_COOL]];
const fieldsOf=l=>LOCS.find(x=>x[0]===l)[2];
const shown=(b,f)=>!(f==="b6"&&b==="local");
const RECV=b=>[["b6","Boxes of 6"],["b12","Boxes of 12"],["b24","Boxes of 24"]].filter(([f])=>shown(b,f));
let state;
const $=s=>document.querySelector(s);
const key=d=>"beercount:"+d;
function blank(){const s={sold:{},spill:{},recv:{},c:{}};BEERS.forEach(([b])=>{s.sold[b]=0;s.spill[b]=0;s.recv[b]={b6:0,b12:0,b24:0};s.c[b]={};LOCS.forEach(([l,,fs])=>{s.c[b][l]=Object.fromEntries(fs.map(([f])=>[f,0]))})});return s}
function norm(s){
  s=s||{};const base=blank();
  const out={sold:Object.assign(base.sold,s.sold||{}),spill:Object.assign(base.spill,s.spill||{}),recv:Object.assign(base.recv,s.recv||{}),c:base.c};
  BEERS.forEach(([b])=>{
    const old=(s.c&&s.c[b])||{};
    LOCS.forEach(([l,,fs])=>{const src=old[l]||{};fs.forEach(([f])=>{out.c[b][l][f]=n(src[f])})});
    const ob=old.bar||{};out.c[b].bar.loose+=n(ob.b12)*12+n(ob.b24)*24;
    const oc=old.coolers||{};out.c[b].cooler1.loose+=n(oc.b12)*12+n(oc.b24)*24+n(oc.loose);
  });
  return out;
}
function load(d){try{const r=localStorage.getItem(key(d));if(r)return norm(JSON.parse(r))}catch(e){}return blank()}
function save(){try{localStorage.setItem(key($("#date").value),JSON.stringify(state));flash("Saved ✓");refreshRemind()}catch(e){flash("")}}
let t;function flash(m){const el=$("#saved");el.textContent=m;clearTimeout(t);t=setTimeout(()=>el.textContent="",1200)}
const n=v=>Math.max(0,parseInt(v)||0);
const locTotal=(b,l)=>fieldsOf(l).reduce((a,[f,,m])=>a+n(state.c[b][l][f])*m,0);
const beerTotal=b=>LOCS.reduce((a,[l])=>a+locTotal(b,l),0);
const delivered=b=>n(state.recv[b].b6)*6+n(state.recv[b].b12)*12+n(state.recv[b].b24)*24;
function prevInfo(){
  const d=$("#date").value;let best=null;
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith("beercount:")){const dd=k.slice(10);if(dd<d&&(!best||dd>best))best=dd}}}catch(e){}
  return best?{date:best,st:load(best)}:null;
}
function prevTotal(st,b){return LOCS.reduce((a,[l])=>a+fieldsOf(l).reduce((x,[f,,m])=>x+n(st.c[b][l][f])*m,0),0)}
function cmpInfo(b){
  const p=prevInfo();if(!p)return null;
  const prev=prevTotal(p.st,b),sold=n(state.sold[b]),sp=n(state.spill[b]),dv=delivered(b),exp=prev-sold-sp+dv,act=beerTotal(b);
  return{date:p.date,prev,sold,sp,dv,exp,act,diff:act-exp};
}
function monthSpill(b){
  const cur=$("#date").value,mk=cur.slice(0,7),days=allDays();let t=n(state.spill[b]);
  Object.keys(days).forEach(d=>{if(d!==cur&&d.slice(0,7)===mk)t+=n(((days[d]||{}).spill||{})[b])});
  return t;
}
const stepper=(a,v)=>`<div class="step"><button ${a} data-d="-1" aria-label="minus">−</button><input type="number" inputmode="numeric" min="0" value="${v}" ${a}><button ${a} data-d="1" aria-label="plus">+</button></div>`;
const SHORT={local:"Local",imported:"Imported",special:"Special"};
function render(){
  $("#nav").innerHTML=BEERS.map(([b])=>`<button class="chip beer-${b}" data-go="${b}"><span>${SHORT[b]}</span><b id="nv-${b}">0</b></button>`).join("");
  $("#app").innerHTML=BEERS.map(([b,name])=>`
  <div class="card bcard beer-${b}" id="sec-${b}">
  <div class="bhead"><h2>${name}</h2>${b==="special"?'<div class="sub">Iceberg &amp; Guinness</div>':b==="imported"?'<div class="sub">Corona, Heineken &amp; MGD</div>':""}</div>
  <div class="bbody"><div class="gap" id="gap-${b}"></div>
  ${LOCS.map(([l,ln])=>`<div class="loc"><div class="locname">${ln}<span id="lt-${b}-${l}">${locTotal(b,l)} beers</span></div>
    ${fieldsOf(l).filter(([f])=>shown(b,f)).map(([f,fl])=>`<div class="frow"><div class="fl">${fl}<small id="ft-${b}-${l}-${f}"></small></div>${stepper(`data-b="${b}" data-l="${l}" data-f="${f}"`,n(state.c[b][l][f]))}</div>`).join("")}</div>`).join("")}
  <div class="tot">
    <div class="big"><span>Counted on hand</span><b id="oh-${b}"></b></div>
    <div class="frow"><div class="fl" id="soldlbl-${b}">Sold since last count</div>${stepper(`data-s="${b}"`,n(state.sold[b]))}</div>
    <div class="big"><span><b style="font-size:16px">Final number</b></span><b class="final" id="fin-${b}"></b></div>
  </div>
  <div class="recv"><div class="k">Delivered since last count</div>
    ${RECV(b).map(([f,fl])=>`<div class="frow"><div class="fl">${fl}</div>${stepper(`data-r="${b}" data-rf="${f}"`,n(state.recv[b][f]))}</div>`).join("")}</div>
  <div class="spill"><div class="sph">Spillage</div>
    <div class="frow"><div class="fl">Spilled since last count<small>Number of beers</small></div>${stepper(`data-p="${b}"`,n(state.spill[b]))}</div>
    <div class="month"><span id="spm-${b}">Total spilled this month</span><b id="spt-${b}">0</b></div></div>
  <div class="cmp" id="cmp-${b}"></div></div></div>`).join("");
  update();
}
function renderSummary(){
  const dv=$("#date").value;
  const nice=new Date(dv+"T12:00:00").toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
  const mname=new Date(dv+"T12:00:00").toLocaleDateString(undefined,{month:"long"});
  const cell=f=>BEERS.map(([b])=>`<td>${f(b)}</td>`).join("");
  const chk=b=>{const c=cmpInfo(b);if(!c)return '<span class="dash">-</span>';return c.diff===0?'<span class="okt">&#10003; OK</span>':(c.diff<0?`<span class="badt">Short ${-c.diff}</span>`:`<span class="badt">Over ${c.diff}</span>`)};
  let counted=0,fin=0;BEERS.forEach(([b])=>{counted+=beerTotal(b);fin+=beerTotal(b)+n(state.sold[b])});
  $("#summary").innerHTML=`<div class="sumhead"><h2>Summary</h2><span>${nice}</span></div>
  <table class="sumtab"><tr><th></th>${BEERS.map(([b])=>`<th class="beer-${b}">${SHORT[b]}</th>`).join("")}</tr>
  <tr>${"<td>Counted on hand</td>"+cell(b=>beerTotal(b))}</tr>
  <tr>${"<td>Sold</td>"+cell(b=>n(state.sold[b]))}</tr>
  <tr class="strong">${"<td>Final number</td>"+cell(b=>beerTotal(b)+n(state.sold[b]))}</tr>
  <tr>${"<td>Delivered</td>"+cell(b=>delivered(b))}</tr>
  <tr>${"<td>Spilled today</td>"+cell(b=>n(state.spill[b]))}</tr>
  <tr>${"<td>Spilled in "+mname+"</td>"+cell(b=>monthSpill(b))}</tr>
  <tr>${"<td>Check</td>"+cell(chk)}</tr></table>
  <div class="sumall"><span>All beers counted: <b>${counted}</b></span><span>Final: <b>${fin}</b></span></div>`;
}
function daysBetween(a,c){return Math.round((Date.UTC(...c.split("-").map((x,i)=>i===1?x-1:+x))-Date.UTC(...a.split("-").map((x,i)=>i===1?x-1:+x)))/86400000)}
function gapInfo(){
  const p=prevInfo();if(!p)return null;
  const days=daysBetween(p.date,$("#date").value);
  const nice=new Date(p.date+"T12:00:00").toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
  return{days,nice};
}
function update(){
  const g=gapInfo();
  BEERS.forEach(([b])=>{
    const box=$(`#gap-${b}`),lbl=$(`#soldlbl-${b}`);
    if(!g){box.style.display="none";lbl.textContent="Sold since last count";}
    else{
      box.style.display="block";
      box.textContent=g.days===1?`Last count: ${g.nice} (yesterday).`:`Last count: ${g.nice}, ${g.days} days ago. Enter sales and deliveries for all ${g.days} days.`;
      lbl.textContent=g.days>1?`Sold since last count (${g.days} days)`:"Sold since last count";
    }
  });
  BEERS.forEach(([b])=>{
    LOCS.forEach(([l])=>{const e=$(`#lt-${b}-${l}`);if(e)e.textContent=locTotal(b,l)+" beers"});
    $(`#oh-${b}`).textContent=beerTotal(b);
    $(`#nv-${b}`).textContent=beerTotal(b);
    LOCS.forEach(([l,,fs])=>fs.forEach(([f,,m])=>{const e=$(`#ft-${b}-${l}-${f}`);if(e)e.textContent=m>1?"= "+n(state.c[b][l][f])*m+" beers":""}));
    const mname=new Date($("#date").value+"T12:00:00").toLocaleDateString(undefined,{month:"long"});
    $(`#spm-${b}`).textContent="Total spilled in "+mname;$(`#spt-${b}`).textContent=monthSpill(b);
    $(`#fin-${b}`).textContent=beerTotal(b)+n(state.sold[b]);
    const c=cmpInfo(b),box=$(`#cmp-${b}`);
    if(!c){box.className="cmp";box.textContent="No earlier count saved yet, so nothing to compare.";}
    else{
      box.className="cmp "+(c.diff===0?"ok":"bad");
      const msg=c.diff===0?"✓ Matches":(c.diff<0?`⚠ Short by ${-c.diff}`:`⚠ Over by ${c.diff}`);
      box.innerHTML=`<b>${msg}</b><div class="d">Last count (${c.date}): ${c.prev} − sold ${c.sold}${c.sp?` − spilled ${c.sp}`:""} + delivered ${c.dv} = expected ${c.exp}. Counted now: ${c.act}.</div>`;
    }
  });
  renderSummary();
  if($("#report").style.display==="block")$("#report").textContent=reportText();
}
function reportText(){
  const d=$("#date").value;
  let out="Beer report - "+d+"\n";let grand=0;
  BEERS.forEach(([b,name])=>{
    const f=beerTotal(b)+n(state.sold[b]);grand+=f;
    out+="\n"+name+"\n";
    LOCS.forEach(([l,ln,fs])=>{const c=state.c[b][l];out+=`  ${ln}: ${locTotal(b,l)}  (${fs.filter(([f])=>shown(b,f)).map(([f,,m])=>m>1?n(c[f])+"x"+m:n(c[f])+" loose").join(", ")})\n`});
    out+=`  On hand: ${beerTotal(b)}\n  Sold: ${n(state.sold[b])}\n  FINAL: ${f}\n  Delivered: ${delivered(b)}\n  Spilled: ${n(state.spill[b])} (this month: ${monthSpill(b)})\n`;
    const c=cmpInfo(b);
    out+=c?`  Check vs ${c.date}: expected ${c.exp}, counted ${c.act}, ${c.diff===0?"matches":(c.diff<0?"SHORT "+(-c.diff):"OVER "+c.diff)}\n`:"  Check: no earlier count\n";
  });
  return out+"\nTotal all beers: "+grand;
}
function apply(el,delta){
  if(el.dataset.s){const b=el.dataset.s;state.sold[b]=Math.max(0,n(state.sold[b])+delta);return}
}
document.addEventListener("click",e=>{
  const ch=e.target.closest("[data-go]");if(ch){const el=$("#sec-"+ch.dataset.go);if(el)el.scrollIntoView({behavior:"smooth",block:"start"});return}
  const bt=e.target.closest("button[data-d]");if(!bt)return;
  const d=+bt.dataset.d;
  const inp=bt.parentElement.querySelector("input");
  const v=Math.max(0,n(inp.value)+d);inp.value=v;
  setVal(inp,v);
});
document.addEventListener("input",e=>{if(e.target.matches(".step input"))setVal(e.target,n(e.target.value))});
document.addEventListener("focusin",e=>{if(e.target.matches(".step input"))e.target.select()});
function setVal(inp,v){
  if(inp.dataset.p)state.spill[inp.dataset.p]=v;else if(inp.dataset.r)state.recv[inp.dataset.r][inp.dataset.rf]=v;else if(inp.dataset.s)state.sold[inp.dataset.s]=v;
  else state.c[inp.dataset.b][inp.dataset.l][inp.dataset.f]=v;
  update();save();
}
$("#btnReport").onclick=()=>{const r=$("#report");const show=r.style.display!=="block";r.style.display=show?"block":"none";$("#btnReport").textContent=show?"Hide report":"Show report";if(show){r.textContent=reportText();r.scrollIntoView({behavior:"smooth"})}};
$("#btnCopy").onclick=async()=>{
  const txt=reportText();
  try{await navigator.clipboard.writeText(txt);flash("Copied ✓")}
  catch(e){const r=$("#report");r.style.display="block";r.textContent=txt;$("#btnReport").textContent="Hide report";const rg=document.createRange();rg.selectNodeContents(r);const s=getSelection();s.removeAllRanges();s.addRange(rg);flash("Select & copy")}
};
let armed=false;
$("#btnClear").onclick=()=>{
  const b=$("#btnClear");
  if(!armed){armed=true;b.textContent="Tap again";setTimeout(()=>{armed=false;b.textContent="Clear"},2500);return}
  armed=false;b.textContent="Clear";state=blank();save();render();
};
$("#date").onchange=()=>{state=load($("#date").value);render()};
const META="beercount-meta:lastbackup";
function todayIso(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function allDays(){const o={};try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith("beercount:")){try{o[k.slice(10)]=JSON.parse(localStorage.getItem(k))}catch(e){}}}}catch(e){}return o}
function lastBackup(){try{return localStorage.getItem(META)}catch(e){return null}}
function markBackup(){try{localStorage.setItem(META,String(Date.now()))}catch(e){}refreshRemind()}
function msg(t,bad){const m=$("#bk-msg");m.textContent=t;m.className="bkmsg"+(bad?" bad":"")}
function refreshRemind(){
  const count=Object.keys(allDays()).length,lb=lastBackup();
  let old=false,txt;
  if(!count)txt="No saved days yet.";
  else if(!lb){txt="You haven't backed up yet.";old=true}
  else{const age=Math.floor((Date.now()-Number(lb))/86400000);txt="Last backup: "+new Date(Number(lb)).toLocaleDateString()+(age>0?" ("+age+" days ago)":" (today)");old=age>=7}
  $("#bk-info").textContent=count?(count+" saved day"+(count===1?"":"s")+". "+txt):txt;
  const r=$("#bk-remind");r.style.display=old?"block":"none";r.textContent="Time to back up your counts. Tap here.";
}
$("#bk-remind").onclick=()=>$("#bk").scrollIntoView({behavior:"smooth"});
async function shareText(name,mime,text){
  try{
    const f=new File([text],name,{type:mime});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return "shared"}
  }catch(e){if(e&&e.name==="AbortError")return "cancel"}
  $("#bkText").value=text;$("#bk-out").style.display="block";
  return "text";
}
$("#bkSave").onclick=async()=>{
  const days=allDays();
  if(!Object.keys(days).length){msg("Nothing to back up yet.");return}
  const data=JSON.stringify({app:"beercount",version:1,exported:new Date().toISOString(),days});
  const r=await shareText("beer-backup-"+todayIso()+".json","text/plain",data);
  if(r==="shared"){markBackup();msg("Backup sent. Check that it saved where you chose.")}
  else if(r==="text")msg("Tap Copy text, then paste it into Notes to keep it safe.");
  else msg("");
};
$("#bkCopy").onclick=async()=>{
  const t=$("#bkText");
  try{await navigator.clipboard.writeText(t.value);markBackup();msg("Copied. Paste it into Notes.")}
  catch(e){t.removeAttribute("readonly");t.select();t.setSelectionRange(0,t.value.length);msg("Text selected. Tap Copy in the menu that appears.")}
};
function csvCell(v){v=String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function buildCsv(){
  const days=allDays(),dates=Object.keys(days).sort();
  const rows=[["Date","Beer","Storage","Bar","Cooler 1","Cooler 2","Counted on hand","Sold","Delivered","Spilled","Month spillage to date","Final number","Expected","Difference (negative = short)"]];
  let prev=null;const mt={};
  dates.forEach(d=>{
    const st=norm(days[d]);
    BEERS.forEach(([b,name])=>{
      const lt=l=>fieldsOf(l).reduce((a,[f,,m])=>a+n(st.c[b][l][f])*m,0);
      const [s1,s2,s3,s4]=LOCS.map(([l])=>lt(l));const oh=s1+s2+s3+s4;
      const sold=n(st.sold[b]),sp=n(st.spill[b]),dv=n(st.recv[b].b6)*6+n(st.recv[b].b12)*12+n(st.recv[b].b24)*24;
      const mk=d.slice(0,7)+b;mt[mk]=(mt[mk]||0)+sp;
      let exp="",diff="";if(prev){exp=prevTotal(prev,b)-sold-sp+dv;diff=oh-exp}
      rows.push([d,name,s1,s2,s3,s4,oh,sold,dv,sp,mt[mk],oh+sold,exp,diff]);
    });
    prev=st;
  });
  return rows.map(r=>r.map(csvCell).join(",")).join("\n");
}
$("#bkCsv").onclick=async()=>{
  if(!Object.keys(allDays()).length){msg("Nothing to export yet.");return}
  const r=await shareText("beer-counts-"+todayIso()+".csv","text/csv",buildCsv());
  if(r==="shared")msg("Spreadsheet file sent.");
  else if(r==="text")msg("Copy this text and paste it into a spreadsheet or Notes.");
  else msg("");
};
$("#bkRestore").onclick=()=>{const p=$("#bk-restore");p.style.display=p.style.display==="none"?"block":"none"};
$("#bkFile").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{$("#bkPaste").value=await f.text();msg("File loaded. Tap Restore.")}catch(err){msg("Couldn't read that file.",1)}};
$("#bkDoRestore").onclick=()=>{
  let o;
  try{o=JSON.parse($("#bkPaste").value.trim())}catch(e){msg("That doesn't look like a Beer Count backup.",1);return}
  if(!o||o.app!=="beercount"||!o.days||typeof o.days!=="object"){msg("That doesn't look like a Beer Count backup.",1);return}
  let c=0;
  try{for(const [d,st] of Object.entries(o.days)){if(/^\d{4}-\d{2}-\d{2}$/.test(d)&&st&&typeof st==="object"&&st.c&&typeof st.c==="object"){localStorage.setItem(key(d),JSON.stringify(st));c++}}}
  catch(e){msg("Couldn't save to this phone.",1);return}
  state=load($("#date").value);render();refreshRemind();$("#bkPaste").value="";
  msg("Restored "+c+" day"+(c===1?"":"s")+".");
};
(function init(){
  const d=new Date();const iso=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  $("#date").value=iso;state=load(iso);render();refreshRemind();
})();
if("serviceWorker"in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
