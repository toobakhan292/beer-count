<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beer Count</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Beer Count">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#b9770e">
<style>
:root{--bg:#f6f3ec;--card:#fff;--ink:#1f1b16;--mute:#7a7164;--line:#e6dfd2;--acc:#b9770e;--acc2:#8a5707;--ok:#2e7d32}
@media(prefers-color-scheme:dark){:root{--bg:#161411;--card:#211e1a;--ink:#f3ede2;--mute:#a39a8b;--line:#363028;--acc:#e0a03a;--acc2:#f0b95c;--ok:#7cc77f}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:env(safe-area-inset-top) 0 calc(90px + env(safe-area-inset-bottom))}
header{padding:16px 16px 8px}
h1{margin:0 0 10px;font-size:22px}
.date{display:flex;gap:8px;align-items:center}
.date input{flex:1;font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.date .saved{font-size:13px;color:var(--ok);min-width:60px;text-align:right}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:12px 16px;padding:14px}
.card h2{margin:0 0 4px;font-size:18px;color:var(--acc2)}
.loc{padding:10px 0;border-top:1px solid var(--line)}
.loc:first-of-type{border-top:0}
.locname{display:flex;justify-content:space-between;font-weight:600;margin-bottom:6px}
.locname span{color:var(--mute);font-weight:500;font-size:14px}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.f label{display:block;font-size:12px;color:var(--mute);margin-bottom:3px;text-align:center}
.step{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.step button{width:30px;border:0;background:var(--bg);color:var(--ink);font-size:20px;padding:0}
.step button:active{background:var(--line)}
.step input{width:100%;min-width:0;border:0;text-align:center;font:600 18px inherit;font-family:inherit;padding:10px 0;background:var(--card);color:var(--ink);-moz-appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.tot{margin-top:10px;padding-top:10px;border-top:2px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.tot .k{color:var(--mute)}
.tot .v{font-weight:700;text-align:right;font-size:18px}
.tot .sold{width:110px}
.final{font-size:26px;color:var(--acc)}
.sum{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px}
.sum button{flex:1;font:600 16px inherit;font-family:inherit;padding:13px;border-radius:12px;border:0;background:var(--acc);color:#fff}
.sum button.sec{background:var(--bg);color:var(--ink);border:1px solid var(--line);flex:.6}
#report{margin:12px 16px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;white-space:pre-wrap;font:14px/1.5 ui-monospace,Menlo,monospace;display:none}
.note{font-size:12px;color:var(--mute);text-align:center;margin:8px 16px}
.recv{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.recv .k{color:var(--mute);margin-bottom:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--bg);font-size:15px}
.cmp .d{font-size:13px;color:var(--mute);margin-top:2px}
.cmp.ok{border-left:4px solid var(--ok)}
.cmp.bad{border-left:4px solid #d32f2f}
.cmp.bad b{color:#d32f2f}
.gap{background:#fff3d6;color:#6b4a00;border-radius:10px;padding:8px 10px;font-size:13px;margin:6px 0 8px;display:none}
@media(prefers-color-scheme:dark){.gap{background:#3a2e12;color:#f0d9a0}}
.remind{display:none;background:#fff3d6;color:#6b4a00;margin:8px 16px 0;padding:10px 12px;border-radius:12px;font-size:14px}
@media(prefers-color-scheme:dark){.remind{background:#3a2e12;color:#f0d9a0}}
#bk button{font:600 15px inherit;font-family:inherit;padding:12px;border-radius:12px;border:0;background:var(--acc);color:#fff}
#bk button.alt{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
#bk button.full{width:100%;margin-top:8px}
.bkrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bkinfo{margin:0 0 10px;color:var(--mute);font-size:14px}
#bk textarea{width:100%;margin-top:8px;font:13px ui-monospace,Menlo,monospace;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
#bk input[type=file]{margin-top:10px;width:100%;font-size:14px}
.bkmsg{margin-top:8px;font-size:14px;color:var(--ok)}
.bkmsg.bad{color:#d32f2f}
</style>
</head>
<body>
<header>
  <h1>🍺 Morning Beer Count</h1>
  <div class="date"><input type="date" id="date"><span class="saved" id="saved"></span></div>
</header>
<div id="bk-remind" class="remind"></div>
<div id="app"></div>
<div class="card" id="bk">
  <h2>Backup</h2>
  <p class="bkinfo" id="bk-info"></p>
  <div class="bkrow"><button id="bkSave">Back up</button><button id="bkCsv" class="alt">Export to spreadsheet</button></div>
  <button id="bkRestore" class="alt full">Restore from backup</button>
  <div id="bk-restore" style="display:none">
    <input type="file" id="bkFile" accept=".json,.txt,application/json,text/plain">
    <textarea id="bkPaste" rows="4" placeholder="Or paste backup text here"></textarea>
    <button id="bkDoRestore" class="full">Restore</button>
  </div>
  <div id="bk-out" style="display:none">
    <textarea id="bkText" rows="6" readonly></textarea>
    <button id="bkCopy" class="full">Copy text</button>
  </div>
  <div class="bkmsg" id="bk-msg"></div>
</div>
<div id="report"></div>
<p class="note">Counts save automatically on this device, one report per date.</p>
<div class="sum">
  <button id="btnReport">Show report</button>
  <button id="btnCopy">Copy</button>
  <button id="btnClear" class="sec">Clear</button>
</div>
<script>
const BEERS=[["local","Local beer"],["imported","Imported beer"],["special","Special import beer"]];
const LOCS=[["storage","Storage"],["bar","Bar"],["coolers","Coolers"]];
const FIELDS=[["b12","Boxes of 12",12],["b24","Boxes of 24",24],["loose","Loose bottles",1]];
let state;
const $=s=>document.querySelector(s);
const key=d=>"beercount:"+d;
function blank(){const s={sold:{},recv:{},c:{}};BEERS.forEach(([b])=>{s.sold[b]=0;s.recv[b]={b12:0,b24:0};s.c[b]={};LOCS.forEach(([l])=>{s.c[b][l]={b12:0,b24:0,loose:0}})});return s}
function load(d){try{const r=localStorage.getItem(key(d));if(r){const s=JSON.parse(r);const base=blank();return{sold:Object.assign(base.sold,s.sold||{}),recv:Object.assign(base.recv,s.recv||{}),c:Object.assign(base.c,s.c||{})}}}catch(e){}return blank()}
function save(){try{localStorage.setItem(key($("#date").value),JSON.stringify(state));flash("Saved ✓");refreshRemind()}catch(e){flash("")}}
let t;function flash(m){const el=$("#saved");el.textContent=m;clearTimeout(t);t=setTimeout(()=>el.textContent="",1200)}
const n=v=>Math.max(0,parseInt(v)||0);
const locTotal=(b,l)=>FIELDS.reduce((a,[f,,m])=>a+n(state.c[b][l][f])*m,0);
const beerTotal=b=>LOCS.reduce((a,[l])=>a+locTotal(b,l),0);
const delivered=b=>n(state.recv[b].b12)*12+n(state.recv[b].b24)*24;
function prevInfo(){
  const d=$("#date").value;let best=null;
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith("beercount:")){const dd=k.slice(10);if(dd<d&&(!best||dd>best))best=dd}}}catch(e){}
  return best?{date:best,st:load(best)}:null;
}
function prevTotal(st,b){return LOCS.reduce((a,[l])=>a+FIELDS.reduce((x,[f,,m])=>x+n(st.c[b][l][f])*m,0),0)}
function cmpInfo(b){
  const p=prevInfo();if(!p)return null;
  const prev=prevTotal(p.st,b),sold=n(state.sold[b]),dv=delivered(b),exp=prev-sold+dv,act=beerTotal(b);
  return{date:p.date,prev,sold,dv,exp,act,diff:act-exp};
}
function render(){
  $("#app").innerHTML=BEERS.map(([b,name])=>`
  <div class="card"><h2>${name}</h2><div class="gap" id="gap-${b}"></div>
  ${LOCS.map(([l,ln])=>`<div class="loc"><div class="locname">${ln}<span id="lt-${b}-${l}">${locTotal(b,l)} beers</span></div>
    <div class="row">${FIELDS.map(([f,fl])=>`<div class="f"><label>${fl}</label><div class="step">
      <button data-b="${b}" data-l="${l}" data-f="${f}" data-d="-1">−</button>
      <input type="number" inputmode="numeric" min="0" value="${n(state.c[b][l][f])}" data-b="${b}" data-l="${l}" data-f="${f}">
      <button data-b="${b}" data-l="${l}" data-f="${f}" data-d="1">+</button></div></div>`).join("")}</div></div>`).join("")}
  <div class="tot">
    <span class="k">Counted on hand</span><span class="v" id="oh-${b}"></span>
    <span class="k" id="soldlbl-${b}">Sold since last count</span><div class="step sold"><button data-s="${b}" data-d="-1">−</button><input type="number" inputmode="numeric" min="0" value="${n(state.sold[b])}" data-s="${b}"><button data-s="${b}" data-d="1">+</button></div>
    <span class="k"><b>Final number</b></span><span class="v final" id="fin-${b}"></span>
  </div>
  <div class="recv"><div class="k">Delivered since last count</div><div class="row2">
    ${[["b12","Boxes of 12"],["b24","Boxes of 24"]].map(([f,fl])=>`<div class="f"><label>${fl}</label><div class="step">
      <button data-r="${b}" data-rf="${f}" data-d="-1">−</button>
      <input type="number" inputmode="numeric" min="0" value="${n(state.recv[b][f])}" data-r="${b}" data-rf="${f}">
      <button data-r="${b}" data-rf="${f}" data-d="1">+</button></div></div>`).join("")}</div></div>
  <div class="cmp" id="cmp-${b}"></div></div>`).join("");
  update();
}
function daysBetween(a,c){return Math.round((Date.UTC(...c.split("-").map((x,i)=>i===1?x-1:+x))-Date.UTC(...a.split("-").map((x,i)=>i===1?x-1:+x)))/86400000)}
function gapInfo(){
  const p=prevInfo();if(!p)return null;
  const days=daysBetween(p.date,$("#date").value);
  const nice=new Date(p.date+"T12:00:00").toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
  return{days,nice};
}
function update(){
  const g=gapInfo();
  BEERS.forEach(([b])=>{
    const box=$(`#gap-${b}`),lbl=$(`#soldlbl-${b}`);
    if(!g){box.style.display="none";lbl.textContent="Sold since last count";}
    else{
      box.style.display="block";
      box.textContent=g.days===1?`Last count: ${g.nice} (yesterday).`:`Last count: ${g.nice}, ${g.days} days ago. Enter sales and deliveries for all ${g.days} days.`;
      lbl.textContent=g.days>1?`Sold since last count (${g.days} days)`:"Sold since last count";
    }
  });
  BEERS.forEach(([b])=>{
    LOCS.forEach(([l])=>{const e=$(`#lt-${b}-${l}`);if(e)e.textContent=locTotal(b,l)+" beers"});
    $(`#oh-${b}`).textContent=beerTotal(b);
    $(`#fin-${b}`).textContent=beerTotal(b)+n(state.sold[b]);
    const c=cmpInfo(b),box=$(`#cmp-${b}`);
    if(!c){box.className="cmp";box.textContent="No earlier count saved yet, so nothing to compare.";}
    else{
      box.className="cmp "+(c.diff===0?"ok":"bad");
      const msg=c.diff===0?"✓ Matches":(c.diff<0?`⚠ Short by ${-c.diff}`:`⚠ Over by ${c.diff}`);
      box.innerHTML=`<b>${msg}</b><div class="d">Last count (${c.date}): ${c.prev} − sold ${c.sold} + delivered ${c.dv} = expected ${c.exp}. Counted now: ${c.act}.</div>`;
    }
  });
  if($("#report").style.display==="block")$("#report").textContent=reportText();
}
function reportText(){
  const d=$("#date").value;
  let out="Beer report - "+d+"\n";let grand=0;
  BEERS.forEach(([b,name])=>{
    const f=beerTotal(b)+n(state.sold[b]);grand+=f;
    out+="\n"+name+"\n";
    LOCS.forEach(([l,ln])=>{const c=state.c[b][l];out+=`  ${ln}: ${locTotal(b,l)}  (${n(c.b12)}x12, ${n(c.b24)}x24, ${n(c.loose)} loose)\n`});
    out+=`  On hand: ${beerTotal(b)}\n  Sold: ${n(state.sold[b])}\n  FINAL: ${f}\n  Delivered: ${delivered(b)}\n`;
    const c=cmpInfo(b);
    out+=c?`  Check vs ${c.date}: expected ${c.exp}, counted ${c.act}, ${c.diff===0?"matches":(c.diff<0?"SHORT "+(-c.diff):"OVER "+c.diff)}\n`:"  Check: no earlier count\n";
  });
  return out+"\nTotal all beers: "+grand;
}
function apply(el,delta){
  if(el.dataset.s){const b=el.dataset.s;state.sold[b]=Math.max(0,n(state.sold[b])+delta);return}
}
document.addEventListener("click",e=>{
  const bt=e.target.closest("button[data-d]");if(!bt)return;
  const d=+bt.dataset.d;
  const inp=bt.parentElement.querySelector("input");
  const v=Math.max(0,n(inp.value)+d);inp.value=v;
  setVal(inp,v);
});
document.addEventListener("input",e=>{if(e.target.matches(".step input"))setVal(e.target,n(e.target.value))});
document.addEventListener("focusin",e=>{if(e.target.matches(".step input"))e.target.select()});
function setVal(inp,v){
  if(inp.dataset.r)state.recv[inp.dataset.r][inp.dataset.rf]=v;else if(inp.dataset.s)state.sold[inp.dataset.s]=v;
  else state.c[inp.dataset.b][inp.dataset.l][inp.dataset.f]=v;
  update();save();
}
$("#btnReport").onclick=()=>{const r=$("#report");const show=r.style.display!=="block";r.style.display=show?"block":"none";$("#btnReport").textContent=show?"Hide report":"Show report";if(show){r.textContent=reportText();r.scrollIntoView({behavior:"smooth"})}};
$("#btnCopy").onclick=async()=>{
  const txt=reportText();
  try{await navigator.clipboard.writeText(txt);flash("Copied ✓")}
  catch(e){const r=$("#report");r.style.display="block";r.textContent=txt;$("#btnReport").textContent="Hide report";const rg=document.createRange();rg.selectNodeContents(r);const s=getSelection();s.removeAllRanges();s.addRange(rg);flash("Select & copy")}
};
let armed=false;
$("#btnClear").onclick=()=>{
  const b=$("#btnClear");
  if(!armed){armed=true;b.textContent="Tap again";setTimeout(()=>{armed=false;b.textContent="Clear"},2500);return}
  armed=false;b.textContent="Clear";state=blank();save();render();
};
$("#date").onchange=()=>{state=load($("#date").value);render()};
const META="beercount-meta:lastbackup";
function todayIso(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function allDays(){const o={};try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith("beercount:")){try{o[k.slice(10)]=JSON.parse(localStorage.getItem(k))}catch(e){}}}}catch(e){}return o}
function lastBackup(){try{return localStorage.getItem(META)}catch(e){return null}}
function markBackup(){try{localStorage.setItem(META,String(Date.now()))}catch(e){}refreshRemind()}
function msg(t,bad){const m=$("#bk-msg");m.textContent=t;m.className="bkmsg"+(bad?" bad":"")}
function refreshRemind(){
  const count=Object.keys(allDays()).length,lb=lastBackup();
  let old=false,txt;
  if(!count)txt="No saved days yet.";
  else if(!lb){txt="You haven't backed up yet.";old=true}
  else{const age=Math.floor((Date.now()-Number(lb))/86400000);txt="Last backup: "+new Date(Number(lb)).toLocaleDateString()+(age>0?" ("+age+" days ago)":" (today)");old=age>=7}
  $("#bk-info").textContent=count?(count+" saved day"+(count===1?"":"s")+". "+txt):txt;
  const r=$("#bk-remind");r.style.display=old?"block":"none";r.textContent="Time to back up your counts. Tap here.";
}
$("#bk-remind").onclick=()=>$("#bk").scrollIntoView({behavior:"smooth"});
async function shareText(name,mime,text){
  try{
    const f=new File([text],name,{type:mime});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return "shared"}
  }catch(e){if(e&&e.name==="AbortError")return "cancel"}
  $("#bkText").value=text;$("#bk-out").style.display="block";
  return "text";
}
$("#bkSave").onclick=async()=>{
  const days=allDays();
  if(!Object.keys(days).length){msg("Nothing to back up yet.");return}
  const data=JSON.stringify({app:"beercount",version:1,exported:new Date().toISOString(),days});
  const r=await shareText("beer-backup-"+todayIso()+".json","text/plain",data);
  if(r==="shared"){markBackup();msg("Backup sent. Check that it saved where you chose.")}
  else if(r==="text")msg("Tap Copy text, then paste it into Notes to keep it safe.");
  else msg("");
};
$("#bkCopy").onclick=async()=>{
  const t=$("#bkText");
  try{await navigator.clipboard.writeText(t.value);markBackup();msg("Copied. Paste it into Notes.")}
  catch(e){t.removeAttribute("readonly");t.select();t.setSelectionRange(0,t.value.length);msg("Text selected. Tap Copy in the menu that appears.")}
};
function csvCell(v){v=String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function buildCsv(){
  const days=allDays(),dates=Object.keys(days).sort();
  const rows=[["Date","Beer","Storage","Bar","Coolers","Counted on hand","Sold","Delivered","Final number","Expected","Difference (negative = short)"]];
  let prev=null;
  dates.forEach(d=>{
    const raw=days[d]||{},base=blank();
    const st={sold:Object.assign(base.sold,raw.sold||{}),recv:Object.assign(base.recv,raw.recv||{}),c:Object.assign(base.c,raw.c||{})};
    BEERS.forEach(([b,name])=>{
      const lt=l=>FIELDS.reduce((a,[f,,m])=>a+n(st.c[b][l][f])*m,0);
      const [s1,s2,s3]=LOCS.map(([l])=>lt(l));const oh=s1+s2+s3;
      const sold=n(st.sold[b]),dv=n(st.recv[b].b12)*12+n(st.recv[b].b24)*24;
      let exp="",diff="";if(prev){exp=prevTotal(prev,b)-sold+dv;diff=oh-exp}
      rows.push([d,name,s1,s2,s3,oh,sold,dv,oh+sold,exp,diff]);
    });
    prev=st;
  });
  return rows.map(r=>r.map(csvCell).join(",")).join("\n");
}
$("#bkCsv").onclick=async()=>{
  if(!Object.keys(allDays()).length){msg("Nothing to export yet.");return}
  const r=await shareText("beer-counts-"+todayIso()+".csv","text/csv",buildCsv());
  if(r==="shared")msg("Spreadsheet file sent.");
  else if(r==="text")msg("Copy this text and paste it into a spreadsheet or Notes.");
  else msg("");
};
$("#bkRestore").onclick=()=>{const p=$("#bk-restore");p.style.display=p.style.display==="none"?"block":"none"};
$("#bkFile").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{$("#bkPaste").value=await f.text();msg("File loaded. Tap Restore.")}catch(err){msg("Couldn't read that file.",1)}};
$("#bkDoRestore").onclick=()=>{
  let o;
  try{o=JSON.parse($("#bkPaste").value.trim())}catch(e){msg("That doesn't look like a Beer Count backup.",1);return}
  if(!o||o.app!=="beercount"||!o.days||typeof o.days!=="object"){msg("That doesn't look like a Beer Count backup.",1);return}
  let c=0;
  try{for(const [d,st] of Object.entries(o.days)){if(/^\d{4}-\d{2}-\d{2}$/.test(d)&&st&&typeof st==="object"&&st.c&&typeof st.c==="object"){localStorage.setItem(key(d),JSON.stringify(st));c++}}}
  catch(e){msg("Couldn't save to this phone.",1);return}
  state=load($("#date").value);render();refreshRemind();$("#bkPaste").value="";
  msg("Restored "+c+" day"+(c===1?"":"s")+".");
};
(function init(){
  const d=new Date();const iso=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  $("#date").value=iso;state=load(iso);render();refreshRemind();
})();
if("serviceWorker"in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
</body>
</html>
